<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#0d1117"/>
  <rect width="1200" height="48" fill="#161b22"/>
  <rect y="48" width="1200" height="1" fill="#30363d"/>
  <text x="20" y="32" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="600">Aptos Fund Flow Tracker</text>
  <text x="900" y="30" fill="#8b949e" font-family="sans-serif" font-size="12">Force graph - example</text>
  <rect y="49" width="1200" height="44" fill="#161b22"/>
  <rect y="92" width="1200" height="1" fill="#30363d"/>
  <text x="20" y="76" fill="#8b949e" font-family="sans-serif" font-size="12">From / To / Min amount / View: Force</text>
  <!-- Links -->
  <g stroke="#30363d" stroke-width="2" fill="none" opacity="0.9">
    <line x1="320" y1="280" x2="520" y2="220"/>
    <line x1="520" y1="220" x2="720" y2="300"/>
    <line x1="320" y1="280" x2="480" y2="400"/>
    <line x1="480" y1="400" x2="680" y2="420"/>
    <line x1="720" y1="300" x2="880" y2="260"/>
    <line x1="680" y1="420" x2="880" y2="260"/>
    <line x1="520" y1="220" x2="420" y2="160"/>
  </g>
  <g stroke="#58a6ff" stroke-width="1.5" fill="none" opacity="0.35">
    <line x1="320" y1="280" x2="720" y2="300"/>
    <line x1="480" y1="400" x2="880" y2="260"/>
  </g>
  <!-- Nodes -->
  <circle cx="320" cy="280" r="22" fill="#21262d" stroke="#39d98a" stroke-width="2" filter="url(#nodeGlow)"/>
  <circle cx="520" cy="220" r="18" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="720" cy="300" r="20" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
  <circle cx="480" cy="400" r="16" fill="#21262d" stroke="#8b949e" stroke-width="1.5"/>
  <circle cx="680" cy="420" r="17" fill="#21262d" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="880" cy="260" r="24" fill="#21262d" stroke="#a371f7" stroke-width="2"/>
  <circle cx="420" cy="160" r="14" fill="#21262d" stroke="#30363d" stroke-width="1.5"/>
  <text x="600" y="640" fill="#6e7681" font-family="sans-serif" font-size="13" text-anchor="middle">Illustrative force-directed network of address relationships</text>
</svg>
