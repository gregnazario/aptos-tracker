<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="flowA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#39d98a;stop-opacity:0.45"/>
    </linearGradient>
    <linearGradient id="flowB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0883e;stop-opacity:0.35"/>
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- App chrome -->
  <rect width="1200" height="675" fill="#0d1117"/>
  <rect width="1200" height="48" fill="#161b22"/>
  <rect y="48" width="1200" height="1" fill="#30363d"/>
  <text x="20" y="32" fill="#e6edf3" font-family="sans-serif" font-size="18" font-weight="600">Aptos Fund Flow Tracker</text>
  <text x="900" y="30" fill="#8b949e" font-family="sans-serif" font-size="12">Sankey view - example</text>
  <rect y="49" width="1200" height="44" fill="#161b22"/>
  <rect y="92" width="1200" height="1" fill="#30363d"/>
  <text x="20" y="76" fill="#8b949e" font-family="sans-serif" font-size="12">From / To / Min amount / View: Sankey</text>
  <!-- Sankey lanes (simplified) -->
  <path d="M180 200 C400 200 400 280 620 280 L620 320 C400 320 400 400 180 400 Z" fill="url(#flowA)" filter="url(#glow)"/>
  <path d="M180 220 C380 220 380 300 600 300 L600 340 C380 340 380 420 200 420 Z" fill="url(#flowB)" opacity="0.85"/>
  <path d="M620 280 C820 280 820 240 980 240 L980 300 C820 300 820 360 640 360 Z" fill="url(#flowA)" opacity="0.7"/>
  <!-- Nodes -->
  <rect x="100" y="180" width="80" height="240" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="140" y="305" fill="#c9d1d9" font-family="sans-serif" font-size="11" text-anchor="middle">Wallet</text>
  <rect x="560" y="240" width="88" height="120" rx="6" fill="#21262d" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="604" y="308" fill="#c9d1d9" font-family="sans-serif" font-size="11" text-anchor="middle">DEX pool</text>
  <rect x="940" y="200" width="88" height="160" rx="6" fill="#21262d" stroke="#30363d" stroke-width="1"/>
  <text x="984" y="288" fill="#c9d1d9" font-family="sans-serif" font-size="11" text-anchor="middle">CEX</text>
  <!-- Caption -->
  <text x="600" y="640" fill="#6e7681" font-family="sans-serif" font-size="13" text-anchor="middle">Illustrative Sankey-style fund flows between tracked addresses</text>
</svg>
