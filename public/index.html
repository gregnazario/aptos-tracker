<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aptos Fund Flow Tracker</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header>
    <h1>Aptos Fund Flow Tracker</h1>
    <div class="header-right">
      <div id="sync-status"></div>
      <button id="export-labels-btn">Export Labels</button>
      <button id="import-labels-btn">Import Labels</button>
      <input type="file" id="import-file-input" accept=".json" class="hidden">
      <button id="manage-addresses-btn">Addresses</button>
    </div>
  </header>

  <div id="address-panel" class="hidden">
    <div class="panel-header">
      <h2>Tracked Addresses</h2>
      <button id="close-panel-btn">&times;</button>
    </div>
    <div class="panel-add-form">
      <input type="text" id="new-address" placeholder="0x... or name.apt">
      <input type="text" id="new-alias" placeholder="Alias (optional)">
      <button id="add-address-btn">Add</button>
    </div>
    <div id="address-list"></div>
  </div>

  <div id="controls">
    <div class="control-group">
      <label>From Date
        <input type="date" id="date-from">
      </label>
      <label>To Date
        <input type="date" id="date-to">
      </label>
    </div>
    <div class="control-group">
      <label>Min Amount
        <input type="range" id="amount-slider" min="0" max="10" step="0.1" value="0">
        <input type="number" id="min-amount" min="0" step="any" placeholder="0">
      </label>
      <label>Asset
        <select id="asset-filter">
          <option value="">All Assets</option>
        </select>
      </label>
      <label>Direction
        <select id="direction-filter">
          <option value="">All</option>
          <option value="inbound">Inbound</option>
          <option value="outbound">Outbound</option>
        </select>
      </label>
      <label>Tax Category
        <select id="tax-category-filter">
          <option value="">All Categories</option>
        </select>
      </label>
    </div>
    <div class="control-group">
      <label>View
        <select id="view-toggle">
          <option value="sankey">Sankey Diagram</option>
          <option value="force">Force Graph</option>
        </select>
      </label>
      <label>Search
        <input type="text" id="address-search" placeholder="Search address...">
      </label>
      <button id="sync-btn">Sync Now</button>
      <button id="refresh-btn">Refresh</button>
    </div>
  </div>

  <div id="chart-container">
    <svg id="chart"></svg>
  </div>

  <div id="context-menu" class="hidden">
    <div class="menu-item" data-action="label-dex">Mark as DEX Pool</div>
    <div class="menu-item" data-action="label-exchange">Mark as Exchange</div>
    <div class="menu-item" data-action="label-bridge">Mark as Bridge</div>
    <div class="menu-item" data-action="label-user">Mark as User</div>
    <div class="menu-item" data-action="label-staking">Mark as Staking Pool</div>
    <div class="menu-item" data-action="label-lending">Mark as Lending Pool</div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="toggle-boundary">Toggle Boundary</div>
    <div class="menu-item" data-action="set-alias">Set Custom Label...</div>
    <div class="menu-separator"></div>
    <div class="menu-item" data-action="copy-address">Copy Address</div>
    <div class="menu-item" data-action="view-explorer">View in Explorer</div>
    <div class="menu-item" data-action="track">Track This Address</div>
  </div>

  <div id="tooltip" class="hidden"></div>

  <script src="/js/bundle.js"></script>
</body>
</html>
